<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق اللياقة البدنية</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000"/>
</head>
<body>
    <div class="container">
        <header>
            <h1>💪 تطبيق اللياقة</h1>
            <p>احصل على جسم مثالي</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <h3>👣 الخطوات</h3>
                <p id="steps">0</p>
            </div>
            <div class="stat-card">
                <h3>🔥 السعرات</h3>
                <p id="calories">0</p>
            </div>
        </div>

        <div class="exercises">
            <h2>🏋️ التمارين اليومية</h2>
            <div class="exercise-list">
                <div class="exercise" onclick="startExercise('تمارين البطن', 30)">
                    <span>💪 تمارين البطن</span>
                    <span>30 ثانية</span>
                </div>
                <div class="exercise" onclick="startExercise('الضغط', 45)">
                    <span>🏃 تمارين الضغط</span>
                    <span>45 ثانية</span>
                </div>
                <div class="exercise" onclick="startExercise('القرفصاء', 60)">
                    <span>🦵 تمارين القرفصاء</span>
                    <span>60 ثانية</span>
                </div>
            </div>
        </div>

        <div class="timer" id="timer" style="display: none;">
            <h2 id="exerciseName"></h2>
            <div class="time-circle">
                <span id="timeLeft">0</span>
            </div>
            <button onclick="stopExercise()">إيقاف</button>
        </div>

        <button class="install-btn" id="installButton" style="display: none;">
            📲 تثبيت التطبيق
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
