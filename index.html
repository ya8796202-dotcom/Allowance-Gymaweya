<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💪 موقع اللياقة البدنية - PWA</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">

    <meta name="theme-color" content="#FF4500"/>
    <meta name="description" content="تطبيقك المتكامل للياقة البدنية والتمارين.">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker: Registered'))
                    .catch(err => console.log(`Service Worker: Error: ${err}`));
            });
        }
    </script>
</head>
<body>

    <header class="header">
        <h1>المدرب الشخصي</h1>
    </header>

    <main class="container">
        <section id="profile-section" class="card">
            <h2>مرحباً بك!</h2>
            <p>سجل الدخول أو تصفح خطط التمارين.</p>
            <button class="btn primary">تسجيل الدخول</button>
        </section>

        <section id="workouts-section" class="card">
            <h2>🔥 تمرين اليوم</h2>
            <div class="workout-item">
                <h3>تمرين الضغط (Push-ups)</h3>
                <p>المجموعات: 3 | التكرارات: 15</p>
                <div class="timer-display">00:00</div>
                <button class="btn secondary start-timer">بدء المؤقت</button>
            </div>
        </section>
        
        <section id="tools-section" class="card">
            <h2>📊 حاسبة مؤشر كتلة الجسم (BMI)</h2>
            <label for="weight">الوزن (كجم):</label>
            <input type="number" id="weight" placeholder="مثال: 75">
            
            <label for="height">الطول (سم):</label>
            <input type="number" id="height" placeholder="مثال: 175">
            
            <button class="btn primary" onclick="calculateBMI()">احسب</button>
            <p id="bmi-result"></p>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="#profile-section">👤 الملف الشخصي</a>
        <a href="#workouts-section">🏋️ التمارين</a>
        <a href="#tools-section">🧮 الأدوات</a>
    </nav>

    <script src="js/app.js"></script>
</body>
</html>
