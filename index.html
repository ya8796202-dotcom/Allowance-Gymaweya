<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Allowance Gymaweya</title>

  <!-- Manifest -->
  <link rel="manifest" href="/Allowance-Gymaweya/manifest.json">

  <!-- Icon -->
  <link rel="icon" href="/Allowance-Gymaweya/icon-192.png">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }
    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
    }
    .section {
      background: white;
      margin: 15px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .btn {
      background: #111;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Allowance Gymaweya</h1>
    <p>خطط تدريب – تغذية – تمارين يومية</p>
  </header>

  <div class="section">
    <h2>💪 تمارين اليوم</h2>
    <ul>
      <li>ضغط × 15</li>
      <li>سكوات × 20</li>
      <li>بلانك × 1 دقيقة</li>
    </ul>
  </div>

  <div class="section">
    <h2>⬇️ تثبيت التطبيق</h2>
    <p>اضغط على زر التثبيت لإضافة التطبيق على جهازك.</p>
    <a id="installBtn" class="btn" style="display:none;">تثبيت التطبيق</a>
  </div>

  <script>
    // Register service worker
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/Allowance-Gymaweya/sw.js");
    }

    let deferredPrompt;
    const btn = document.getElementById("installBtn");

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btn.style.display = "inline-block";
    });

    btn.addEventListener("click", () => {
      deferredPrompt.prompt();
      btn.style.display = "none";
    });
  </script>

</body>
</html>
